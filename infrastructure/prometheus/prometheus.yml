global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: music4all

# Reglas de alerta (Fase 6). El archivo se monta en el contenedor vía docker-compose.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: music4all-backend
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 10s
